name: Prepare VibeHosting image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.release.config.ts --workers=2 --reporter=list
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tech-analyst-club" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
      - name: Record immutable deployment image
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Source commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Ensure GHCR package visibility is public before MCP registration.' >> "$GITHUB_STEP_SUMMARY"
